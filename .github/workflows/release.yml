name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: Release ${{ github.ref_name }}
          discussion_category: announcements

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push code-reviewer image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/code-reviewer:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/code-reviewer:latest

      - name: Build and push feishu-relay image
        uses: docker/build-push-action@v5
        with:
          context: ./feishu-relay
          file: ./feishu-relay/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/feishu-relay:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/feishu-relay:latest
